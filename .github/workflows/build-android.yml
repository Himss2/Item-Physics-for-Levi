name: Build Android levipack

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Build arm64-v8a
        shell: bash
        run: |
          chmod +x scripts/*.sh
          scripts/build-android.sh
      - name: Upload levipack
        uses: actions/upload-artifact@v4
        with:
          name: levi-item-physics-arm64-v8a
          path: |
            dist/arm64-v8a/levi-item-physics.levipack
            dist/arm64-v8a/levi-item-physics/liblevi_item_physics.so
