name: Build Levi Item Physics

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            >> "$GITHUB_ENV"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Verify shared library
        run: |
          test -f build/liblevi_item_physics.so

          file build/liblevi_item_physics.so

          readelf -h build/liblevi_item_physics.so

      - name: Create LeviPack
        run: |
          rm -rf package
          mkdir -p package

          cp manifest.json \
             package/manifest.json

          cp build/liblevi_item_physics.so \
             package/liblevi_item_physics.so

          cd package

          zip -9 ../levi-item-physics.levipack \
            manifest.json \
            liblevi_item_physics.so

          cd ..

      - name: Verify LeviPack contents
        run: |
          echo "=== LeviPack contents ==="

          unzip -l levi-item-physics.levipack

          COUNT=$(unzip -Z1 levi-item-physics.levipack | wc -l)

          if [ "$COUNT" -ne 2 ]; then
            echo "ERROR:"
            echo "LeviPack must contain exactly 2 files."
            exit 1
          fi

          unzip -Z1 levi-item-physics.levipack \
            | grep -Fx "manifest.json"

          unzip -Z1 levi-item-physics.levipack \
            | grep -Fx "liblevi_item_physics.so"

      - name: Prepare GitHub artifact
        run: |
          rm -rf artifact
          mkdir -p artifact

          cp levi-item-physics.levipack \
             artifact/levi-item-physics.levipack

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: levi-item-physics-arm64-v8a
          path: artifact/levi-item-physics.levipack
          if-no-files-found: error
          retention-days: 30
